# Docker Compose configuration for production
# Usage: docker compose up -d

services:
  gonnect4:
    image: ghcr.io/marvinegger/gonnect4:latest
    container_name: gonnect4-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"  # Bind only to localhost for security
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: gonnect4-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true           # Remove old images
      - WATCHTOWER_POLL_INTERVAL=300      # Check every 5 minutes (300 seconds)
      - WATCHTOWER_LABEL_ENABLE=true      # Only update containers with the label
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: --debug
