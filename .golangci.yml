# golangci-lint config for GOnnect4
# https://golangci-lint.run/docs/configuration/file/

version: "2"

run:
  timeout: 5m

linters:
  # v2 replacement for "disable-all: true"
  default: none

  # Enable only what we want
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam

  # v2 replacement for "linters-settings"
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*os.File).Close

    misspell:
      locale: US

  # v2 replacement for run.skip-dirs / run.skip-files and issues.exclude-rules
  exclusions:
    # Skip generated / build outputs (paths are regexes)
    paths:
      - '(^|/)vendor/'
      - '(^|/)dist/'
      - '(^|/)client/dist/'
      - '.*\.pb\.go$'

    # Loosen rules for tests
    rules:
      - path: '.*_test\.go$'
        linters:
          - errcheck
          - unparam

issues:
  # Same as before (still valid)
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
