# golangci-lint config for GOnnect4
# https://golangci-lint.run/usage/configuration/

version: 2

run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam

linters-settings:
  errcheck:
    exclude-functions:
      - (io.Closer).Close
      - (*database/sql.Rows).Close
      - (*os.File).Close

  misspell:
    locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

  # Skip generated / build outputs
  exclude-dirs:
    - vendor
    - dist
    - client/dist

  # Skip generated files
  exclude-files:
    - ".*\\.pb\\.go$"

  # Loosen rules for tests
  exclude-rules:
    - path: ".*_test\\.go$"
      linters:
        - errcheck
        - unparam

  new: false
