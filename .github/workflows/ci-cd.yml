name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "*.*.*" ]  # Triggers on versioned tags (1.0.0, 2.1.3, ...)
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gonnect4

jobs:
  # Linting Go
  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: false

    - name: Lint Server Code
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        working-directory: server
        args: --timeout=5m

    - name: Lint Client WASM Code
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        working-directory: client/wasm
        args: --timeout=5m --build-tags=js,wasm
      env:
        GOOS: js
        GOARCH: wasm

  # Unit tests
  test:
    name: Test Library
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache-dependency-path: server/go.sum

    - name: Get dependencies
      working-directory: ./server
      run: go mod download

    - name: Run Tests in server/lib
      working-directory: ./server/lib
      run: go test -v .

  # Job 3: Build and push Docker images (tag based)
  build-and-push:
    name: Build and Push Docker Image
    # Exec only if we have a versioned tag (1.0.0, 2.1.3, ...)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]  # Wait for lint and test jobs passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            # Tag 'latest' for each last release
            type=raw,value=latest
            # Sémantique tags of version: v1.0.0 -> 1.0.0, 1.0, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=gha
          cache-to: type=gha,mode=max